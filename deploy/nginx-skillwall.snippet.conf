# Paste into EVERY school's server block in the wall's deploy/nginx-forum-app.conf,
# next to the existing `location /squadpool/` block. The wall calls the API
# same-origin at /skillwall/..., so no CORS and the session token never leaves
# the wall's own domain.
#
# 172.17.0.1 = docker0 gateway on forum-app. forum-web runs on the default
# bridge network, so 127.0.0.1 inside it is the container itself, not the host.
location /skillwall/ {
    proxy_pass http://172.17.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /skillwall;
    proxy_read_timeout 30s;
    proxy_buffering off;
    client_max_body_size 2m;
}
