# forum-app deployment: one API container + one Postgres, both memory-capped so
# they can never crowd nginx / cloudflared on the shared host.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillwall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skillwall}
    volumes:
      - skillwall-pg:/var/lib/postgresql/data
    # Host-only port for psql / pg_dump. Never published beyond loopback.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillwall} -d ${POSTGRES_DB:-skillwall}"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 384m
    shm_size: 128m

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skillwall}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skillwall}
      UPLOAD_DIR: /data/uploads
    volumes:
      - skillwall-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # API_BIND=172.17.0.1 (docker0) lets the forum-web nginx container reach it
    # while keeping it off the Tailscale / public interfaces.
    ports:
      - "${API_BIND:-127.0.0.1}:8787:8787"
    mem_limit: 256m

volumes:
  skillwall-pg:
  skillwall-uploads:
